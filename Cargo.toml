[package]
name = "web_scraper"
version = "0.1.0"
edition = "2021"

[dependencies]
dotenv = "0.15.0"
headless_chrome = "1.0.15"
regex = "1.11.1"
reqwest = { version = "0.12.12", features = ["blocking", "json"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.135"
tokio = { version = "1.42.0", features = ["full"] }
